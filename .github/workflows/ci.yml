name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Los dos motores y el catálogo se prueban SIEMPRE juntos, aunque el PR solo
# toque uno: lo que este repositorio garantiza es que la pareja sigue siendo
# interoperable, y eso solo se sabe ejecutando las dos suites contra el mismo
# schema/ y los mismos vectors/.

jobs:
  schema:
    name: Catálogo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schema
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # El validador no tiene dependencias: corre con node a secas. Comprueba
      # además que core-web/src/schema.ts sigue siendo el espejo de schema.json.
      - name: Validate
        run: npm test

  jvm:
    name: Motor Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-jvm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: core-jvm/*.gradle.kts

      - name: Test
        run: ./gradlew test --no-daemon

      # Lo que VectorGenerator acaba de producir, para compararlo a mano con
      # vectors/acheron-vectors.json cuando se regeneran.
      - name: Upload generated vectors
        uses: actions/upload-artifact@v4
        with:
          name: acheron-vectors
          path: core-jvm/build/acheron-vectors.json

  web:
    name: Motor web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json esta en .gitignore, asi que no hay lockfile que
      # cachear ni con el que hacer `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # npm test compila antes (pretest), asi que cubre tipos y comportamiento.
      - name: Typecheck and run suites
        run: npm test

  # Un tag vX.Y.Z publica los DOS paquetes con el mismo numero (lockstep): el
  # numero dice "esta pareja es interoperable", no "este paquete cambio". La
  # version la manda el tag, nunca lo que diga el codigo.
  #
  # Van en serie y Maven primero: sus versiones son inmutables, asi que si
  # falla no se publica tampoco la de npm y el tag se puede repetir entero.
  publish-jvm:
    name: Publicar motor Java
    needs: [schema, jvm, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: core-jvm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: core-jvm/*.gradle.kts

      - name: Publish to GitHub Packages
        run: |
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-web:
    name: Publicar motor web
    needs: publish-jvm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: core-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: '@projectellysia'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # `prepare` compila, asi que lo que se publica es siempre dist/ recien
      # construido y nunca un dist/ viejo que alguien tuviera en local.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
