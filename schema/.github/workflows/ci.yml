name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate schema.json
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # El validador no tiene dependencias: corre con node a secas, asi que no
      # hay `npm install` que hacer ni lockfile que cachear.
      - name: Validate
        run: npm test
