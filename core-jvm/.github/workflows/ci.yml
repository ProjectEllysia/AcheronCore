name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Test
        run: ./gradlew test --no-daemon

      # Fuente de verdad de la interop con el cliente web: el CI de la web
      # descarga este artefacto y comprueba que su implementacion JS descifra
      # exactamente lo que cifro Java.
      - name: Upload interop vectors
        uses: actions/upload-artifact@v4
        with:
          name: acheron-vectors
          path: build/acheron-vectors.json

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
